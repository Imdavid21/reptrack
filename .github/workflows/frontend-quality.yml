name: Frontend quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repository lockfile predates several existing package.json changes.
      # Install from package.json without rewriting the checked-in lockfile so
      # this workflow can validate the frontend without sneaking dependency
      # churn into the product-overhaul PR.
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run lint
