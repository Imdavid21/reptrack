name: Frontend quality

on:
  pull_request:
    branches:
      - main
      - qa/reptrack-overhaul-base
  push:
    branches:
      - main
      - 'overhaul/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - run: npm run lint
