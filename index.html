<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Aggressive cache busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>HEALTH/OS | Personal Health Operating System</title>
    <meta name="description" content="Your personal health operating system - track workouts, nutrition, vitals, and habits in one place" />
    <meta name="author" content="HEALTH/OS" />

    <meta property="og:title" content="HEALTH/OS | Personal Health Operating System" />
    <meta property="og:description" content="Your personal health operating system - track workouts, nutrition, vitals, and habits in one place" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FitTrack" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Inline critical CSS for instant splash -->
    <style>
      body {
        margin: 0;
        background: #000;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: pulse 1.5s ease-in-out infinite;
      }
      .splash-heart {
        width: 40px;
        height: 40px;
      }
      .splash-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #fff;
      }
      .splash-text-dim {
        color: #666;
      }
      .splash-loader {
        margin-top: 1.5rem;
        display: flex;
        gap: 4px;
      }
      .splash-dot {
        width: 8px;
        height: 8px;
        background: #fff;
        animation: bounce 1s ease-in-out infinite;
      }
      .splash-dot:nth-child(2) { animation-delay: 0.1s; }
      .splash-dot:nth-child(3) { animation-delay: 0.2s; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-8px); }
      }
    </style>
  </head>

  <body>
    <!-- Instant splash screen - shows before React loads -->
    <div id="splash">
      <div class="splash-logo">
        <img src="/favicon.png" alt="" class="splash-heart" />
        <div class="splash-text">
          HEALTH<span class="splash-text-dim">/</span>OS
        </div>
      </div>
      <div class="splash-loader">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide splash when React is ready -->
    <script>
      window.hideSplash = function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('fade-out');
          setTimeout(function() { splash.remove(); }, 300);
        }
      };
    </script>
  </body>
</html>
