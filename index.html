<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Apply the saved theme synchronously, before first paint, to avoid a
         flash of the wrong color scheme on load. Mirrors ThemeContext. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fittrack-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var cls = document.documentElement.classList;
          cls.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!-- PWA caching handled by service worker -->
    
    <title>Reptrack Fitness | Personal Health & Fitness Tracker</title>
    <meta name="description" content="Track workouts, nutrition, vitals, and habits in one place. AI-powered insights and smart workout plans." />
    <meta name="author" content="Reptrack Fitness" />

    <meta property="og:title" content="Reptrack Fitness | Personal Health & Fitness Tracker" />
    <meta property="og:description" content="Track workouts, nutrition, vitals, and habits in one place. AI-powered insights and smart workout plans." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FitTrack" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #f7f7f7;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0d0d0d; }
      }
      /* PWA splash screen — visible before any JS loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f7f7;
        transition: opacity .3s ease-out;
      }
      #splash .brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: .2em;
        color: #141414;
        animation: pulse-brand 1.5s ease-in-out infinite;
      }
      #splash .brand span { color: #616161; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0d0d0d; }
        #splash .brand { color: #f5f5f5; }
        #splash .brand span { color: #adadad; }
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      @keyframes pulse-brand {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
      }
    </style>
  </head>

  <body>
    <div id="splash"><div class="brand">REPTRACK<span>&nbsp;</span>FITNESS</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
