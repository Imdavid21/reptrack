<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    
    <!-- PWA caching handled by service worker -->
    
    <title>Reptrack Fitness | Personal Health & Fitness Tracker</title>
    <meta name="description" content="Track workouts, nutrition, vitals, and habits in one place. AI-powered insights and smart workout plans." />
    <meta name="author" content="Reptrack Fitness" />

    <meta property="og:title" content="Reptrack Fitness | Personal Health & Fitness Tracker" />
    <meta property="og:description" content="Track workouts, nutrition, vitals, and habits in one place. AI-powered insights and smart workout plans." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FitTrack" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      html, body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #000; }
      }
      /* PWA splash screen — visible before any JS loads */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        transition: opacity .3s ease-out;
      }
      #splash .brand {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: .2em;
        color: #161616;
        animation: pulse-brand 1.5s ease-in-out infinite;
      }
      #splash .brand span { color: #737373; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #000; }
        #splash .brand { color: #f5f5f5; }
        #splash .brand span { color: #737373; }
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      @keyframes pulse-brand {
        0%, 100% { opacity: 1; }
        50% { opacity: .4; }
      }
    </style>
  </head>

  <body>
    <div id="splash"><div class="brand">REPTRACK<span>&nbsp;</span>FITNESS</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
