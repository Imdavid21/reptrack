<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepTrack</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="brand-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <span class="brand-name">RepTrack</span>
        </div>
        <button id="connectButton" class="connect-button" type="button">Connect</button>
      </header>

      <section class="composer">
        <div class="tabs" role="tablist" aria-label="Log type">
          <button id="foodTab" class="tab active" type="button">Food</button>
          <button id="waterTab" class="tab" type="button">Water</button>
        </div>

        <div id="foodPanel">
          <textarea id="foodInput" maxlength="500" rows="4" placeholder="What did you eat?"></textarea>
          <div class="meta-row">
            <select id="mealType" aria-label="Meal type">
              <option value="breakfast">Breakfast</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
              <option value="snack" selected>Snack</option>
            </select>
            <label class="photo-button" for="foodPhoto">Add photo</label>
            <input id="foodPhoto" type="file" accept="image/*" hidden />
          </div>
          <div id="photoChip" class="photo-chip hidden">
            <span id="photoName"></span>
            <button id="clearPhoto" type="button" aria-label="Remove photo">×</button>
          </div>
          <button id="logFood" class="primary" type="button">Log</button>
        </div>

        <div id="waterPanel" class="hidden">
          <div class="water-grid">
            <button class="water-button" data-ml="250" type="button">250 ml</button>
            <button class="water-button" data-ml="500" type="button">500 ml</button>
            <button class="water-button" data-ml="750" type="button">750 ml</button>
          </div>
          <div class="custom-water">
            <input id="waterInput" type="number" min="50" max="10000" step="50" inputmode="numeric" placeholder="Custom ml" />
            <button id="logWater" class="primary compact" type="button">Log</button>
          </div>
        </div>
      </section>

      <section class="reminder-row">
        <div>
          <strong>Water reminder</strong>
          <span id="reminderLabel">Every 60 min</span>
        </div>
        <div class="reminder-controls">
          <select id="reminderInterval" aria-label="Water reminder interval">
            <option value="30">30m</option>
            <option value="60" selected>60m</option>
            <option value="90">90m</option>
            <option value="120">2h</option>
          </select>
          <label class="switch" aria-label="Enable water reminder">
            <input id="reminderToggle" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <div id="feedback" class="feedback hidden" role="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
